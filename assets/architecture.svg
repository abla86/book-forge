<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">BookForge AI architecture</title>
  <desc id="desc">Architecture overview showing a React TypeScript frontend, Express API, domain engines, security services, PostgreSQL persistence and Gemini AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#101c33"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#63f5b1"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="620" rx="32" fill="url(#bg)"/>
  <text x="70" y="75" fill="#f8fafc" font-family="Arial,sans-serif" font-size="34" font-weight="700">BOOKFORGE AI</text>
  <text x="70" y="108" fill="#94a3b8" font-family="Arial,sans-serif" font-size="17">Full-stack architecture · AI · security · persistence · document workflows</text>

  <g font-family="Arial,sans-serif">
    <rect x="70" y="170" width="250" height="100" rx="18" fill="#14243b" stroke="#334155"/>
    <text x="195" y="210" text-anchor="middle" fill="#7dd3fc" font-size="16" font-weight="700">FRONTEND</text>
    <text x="195" y="240" text-anchor="middle" fill="#e2e8f0" font-size="20">React + TypeScript</text>

    <rect x="475" y="170" width="250" height="100" rx="18" fill="#14243b" stroke="#334155"/>
    <text x="600" y="210" text-anchor="middle" fill="#63f5b1" font-size="16" font-weight="700">API LAYER</text>
    <text x="600" y="240" text-anchor="middle" fill="#e2e8f0" font-size="20">Express + Node.js</text>

    <rect x="880" y="170" width="250" height="100" rx="18" fill="#14243b" stroke="#334155"/>
    <text x="1005" y="210" text-anchor="middle" fill="#c4b5fd" font-size="16" font-weight="700">AI</text>
    <text x="1005" y="240" text-anchor="middle" fill="#e2e8f0" font-size="20">Gemini API</text>

    <rect x="150" y="390" width="270" height="120" rx="18" fill="#101d31" stroke="#334155"/>
    <text x="285" y="430" text-anchor="middle" fill="#63f5b1" font-size="16" font-weight="700">DOMAIN ENGINES</text>
    <text x="285" y="458" text-anchor="middle" fill="#e2e8f0" font-size="15">Bible · Generation · Continuity</text>
    <text x="285" y="483" text-anchor="middle" fill="#e2e8f0" font-size="15">Versioning · Assets</text>

    <rect x="465" y="390" width="270" height="120" rx="18" fill="#101d31" stroke="#334155"/>
    <text x="600" y="430" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="700">SECURITY</text>
    <text x="600" y="458" text-anchor="middle" fill="#e2e8f0" font-size="15">Sessions · Roles · Rate limits</text>
    <text x="600" y="483" text-anchor="middle" fill="#e2e8f0" font-size="15">Audit · Cost guard · Kill switch</text>

    <rect x="780" y="390" width="270" height="120" rx="18" fill="#101d31" stroke="#334155"/>
    <text x="915" y="430" text-anchor="middle" fill="#7dd3fc" font-size="16" font-weight="700">PERSISTENCE</text>
    <text x="915" y="458" text-anchor="middle" fill="#e2e8f0" font-size="15">PostgreSQL</text>
    <text x="915" y="483" text-anchor="middle" fill="#e2e8f0" font-size="15">Projects · Users · Audit data</text>
  </g>

  <g stroke="url(#accent)" stroke-width="4" fill="none" filter="url(#glow)" opacity="0.9">
    <path d="M320 220 H475"/><path d="M725 220 H880"/>
    <path d="M600 270 V390"/><path d="M525 270 C470 320 390 350 285 390"/>
    <path d="M675 270 C735 320 830 350 915 390"/>
  </g>
  <g fill="#63f5b1">
    <circle cx="320" cy="220" r="6"/><circle cx="475" cy="220" r="6"/><circle cx="725" cy="220" r="6"/><circle cx="880" cy="220" r="6"/><circle cx="600" cy="390" r="6"/>
  </g>
</svg>
