name: Security Dependency Audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit every npm lockfile
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r lock; do
            found=1
            dir="$(dirname "$lock")"
            echo "::group::npm audit $dir"
            npm audit --prefix "$dir" --audit-level=high
            echo "::endgroup::"
          done < <(find . -name package-lock.json -not -path '*/node_modules/*' -print)
          if [ "$found" -eq 0 ]; then
            echo "No package-lock.json files found; npm audit not applicable."
          fi
