name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb1e1b3e0e4b5f0e0d6d2b4b7c1b0f7e5c4 # v7.0.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c5f3f5d7f8e0f6c3a2b1d4e5f6a7b8c9d0 # v4.36.0
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@7211b7c5f3f5d7f8e0f6c3a2b1d4e5f6a7b8c9d0 # v4.36.0
        with:
          category: /language:javascript-typescript
