name: One-time security hardening

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    if: github.actor == 'abla86'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Harden authentication and fix syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('server.ts')
          s = p.read_text()

          start = s.index('// ---------------------------------------------------------------------\n// Hardened User Context Extraction & Database Authentication')
          end = s.index('// ---------------------------------------------------------------------\n// AUTHENTICATION & SESSION MANAGEMENT', start)
          replacement = '''// ---------------------------------------------------------------------
// Authoritative User Context Extraction
// Identity MUST come only from a validated server-side session.
// ---------------------------------------------------------------------
function getSessionToken(req: Request): string {
  const authHeader = req.headers.authorization;
  if (authHeader?.startsWith("Bearer ")) {
    return authHeader.slice(7).trim();
  }

  const cookieName = process.env.NODE_ENV === "production" ? "__Host-bf_session" : "bf_session";
  const cookieHeader = req.headers.cookie || "";
  const cookiePair = cookieHeader
    .split(";")
    .map((part) => part.trim())
    .find((part) => part.startsWith(`${cookieName}=`));

  return cookiePair
    ? decodeURIComponent(cookiePair.slice(cookieName.length + 1))
    : "";
}

function getAuthUser(req: Request): AuthUser {
  const token = getSessionToken(req);
  if (!token) {
    throw new Error("Ugyldig eller manglende sesjon.");
  }

  const session = db.getSession(token);
  if (!session) {
    throw new Error("Sesjonen er ugyldig eller utløpt.");
  }

  const user = db.getUser(session.userId);
  if (!user) {
    db.deleteSession(token);
    throw new Error("Brukeren til sesjonen finnes ikke.");
  }

  return {
    id: user.id,
    name: user.name,
    email: user.email,
    role: user.role,
    subscriptionPlan: user.subscriptionPlan,
    organizationId: user.organizationId,
  };
}

'''
          s = s[:start] + replacement + s[end:]

          # Logout must invalidate both bearer and cookie-backed sessions.
          old = re.search(r'app\.post\("/api/auth/logout", \(req, res\) => \{.*?\n\}\);\n\napp\.get\("/api/auth/me"', s, re.S)
          if not old:
              raise SystemExit('logout block not found')
          new_logout = '''app.post("/api/auth/logout", (req, res) => {
  const token = getSessionToken(req);
  if (token) {
    const session = db.getSession(token);
    if (session) {
      const user = db.getUser(session.userId);
      AuditLogger.log({
        actorId: session.userId,
        actorRole: user?.role || "READER",
        action: "USER_LOGOUT",
        status: "SUCCESS",
      });
      db.deleteSession(token);
    }
  }

  const secureCookie = process.env.NODE_ENV === "production";
  const sessionCookieName = secureCookie ? "__Host-bf_session" : "bf_session";
  res.setHeader(
    "Set-Cookie",
    `${sessionCookieName}=; Path=/; HttpOnly; SameSite=Strict; Max-Age=0${secureCookie ? "; Secure" : ""}`
  );
  res.setHeader("Clear-Site-Data", '"cache", "cookies", "storage"');
  res.setHeader("Cache-Control", "no-store");
  return res.json({ success: true });
});

app.get("/api/auth/me"'''
          s = s[:old.start()] + new_logout + s[old.end():]

          # Keep the richer /auth/me response and remove the unreachable duplicate.
          first = 'app.get("/api/auth/me", (req, res) => {\n  const user = getAuthUser(req);\n  return res.json({ user });\n});'
          second = 'app.get("/api/auth/me", (req, res) => {\n  const user = getAuthUser(req);\n  const allUsers = user.role === "FOUNDER" ? db.getUsers() : undefined;\n  return res.json({ user, allUsers });\n});'
          if first in s and second in s:
              s = s.replace(first, '', 1)

          # Remove an accidental extra closing brace in the synopsis endpoint.
          s = s.replace('  }\n  }\n\n  // 2. Emergency Kill Switch Guard', '  }\n\n  // 2. Emergency Kill Switch Guard', 1)

          p.write_text(s)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Security tests
        run: npm run security:test

      - name: Full tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit hardened server
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "Harden session authentication and fix server syntax" || exit 0
          git push

      - name: Remove one-time workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/harden-security.yml
          git commit -m "Remove one-time security hardening workflow"
          git push
