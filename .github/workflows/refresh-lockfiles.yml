name: One-time lockfile refresh

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: startsWith(github.event.head_commit.message, 'chore: trigger lockfile refresh')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Regenerate root Bun lockfile
        run: bun install --lockfile-only

      - name: Remove unused Trusity Bun lockfile
        run: rm -f apps/trusity/bun.lock

      - name: Commit refreshed lockfiles and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git rm -f apps/trusity/bun.lock .github/workflows/refresh-lockfiles.yml
          git commit -m "chore: refresh lockfiles"
          git push
